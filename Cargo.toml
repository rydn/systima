[package]
name = "systima"
version = "0.1.0"
edition = "2024"
description = "A retro-cyberpunk terminal system monitor: bmon-style graphs, htop-style task list"
license = "MIT"
readme = "README.md"
rust-version = "1.85"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.39"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[features]
default = []
alloc-count = []

[[bench]]
name = "render"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.bench]
inherits = "release"
strip = false
